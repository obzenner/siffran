<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'">

<body class="flex h-dvh flex-col overflow-hidden bg-background font-sans text-foreground">
  <noscript>Empirica UI renders with JavaScript.</noscript>
  <header id="bar" class="shrink-0 border-b border-border bg-background px-l py-s"></header>
  <div class="flex min-h-0 flex-1">

      <div class="flex max-w-page flex-col gap-s">
        <h2 id="list-title" class="sr-only"></h2>
        <div class="flex flex-col gap-xs">
          <input id="search" type="search" class="input" autocomplete="off">
          <p id="coverage" class="text-xs text-muted-foreground" aria-live="polite"></p>
        </div>
        <ev-runs id="runs" class="flex flex-col gap-m"></ev-runs>
      </div>
    </section>
    <main id="workspace" class="min-h-0 min-w-0 flex-1 overflow-y-auto px-l py-m"><ev-run id="run" class="block max-w-page"></ev-run></main>
  </div>
